# Perfil de produção (Render)
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never

logging.level.root=WARN
logging.level.br.com.escola=INFO

## property 'management.endpoint.health.probes.enabled' is not recognized in this Spring Boot version
## Commented out and enable the health endpoint instead
management.endpoint.health.enabled=true
