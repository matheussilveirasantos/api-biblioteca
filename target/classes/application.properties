spring.application.name=biblioteca

# Banco de Dados - usa DATABASE_URL do Render ou fallback local
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/biblioteca}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.locale=pt_BR

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# JWT
jwt.secret=${JWT_SECRET:01010010_01100001_01111001_01101100_01100001}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Email (SMTP - Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:seuemail@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false

biblioteca.email.destinatario=${EMAIL_DESTINATARIO:admin@biblioteca.com}

# CORS - defina a URL do seu frontend React em producao
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
