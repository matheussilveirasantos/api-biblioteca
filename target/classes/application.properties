spring.application.name=biblioteca

# ================================
# Banco de Dados (PostgreSQL)
# ================================
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ================================
# Servidor
# ================================
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always
spring.output.ansi.enabled=NEVER

# ================================
# Swagger / OpenAPI
# ================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method

biblioteca.openapi.dev-url=${RENDER_EXTERNAL_URL:http://localhost:8080}
biblioteca.openapi.prod-url=${RENDER_EXTERNAL_URL:http://localhost:8080}

# ================================
# Jackson / Serialização
# ================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.locale=pt_BR

# ================================
# Paginação
# ================================
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ================================
# Logging (console apenas — sem arquivo)
# ================================
logging.level.root=WARN
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.br.com.escola=INFO

# ================================
# JWT (obrigatório em produção — defina JWT_SECRET no Render)
# ================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ================================
# Email (SMTP - Gmail)
# ================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noreply@biblioteca.com}
spring.mail.password=${MAIL_PASSWORD:changeme}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false

# ================================
# Destinatários de e-mail
# ================================
biblioteca.email.destinatario=${EMAIL_DESTINATARIOS:admin@biblioteca.com}

# ================================
# Actuator (health check — Render)
# ================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never